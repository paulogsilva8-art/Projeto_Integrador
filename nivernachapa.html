<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Niver na Chapa</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f2e1e1;
            background-image: url(img/fundotundo.png);
        }

        header {
            background-color: #be0808;
            background-image: url(img/fundovermelho.png);
            color: white;
            text-align: center;
            font-size: 80px;
            font-weight: bold;
            padding: 70px 30px;
        }

        .container {
            display: flex;
            align-items: center;
            justify-content: space-around;
            gap: 50px;
            margin: 40px;
        }

        .itens_cont {
            width: 50%;
            background-color: #b30000;
            border-radius: 10px;
            text-align: center;
            padding: 20px;
        }

        .itens_cont img {
            width: 50%;
            border-radius: 10px;
        }

        .itens_cont h2 {
            color: rgb(252, 231, 204);
        }

        .itens_cont ul li {
            color: antiquewhite;
        }

        summary {
            list-style: none;
            cursor: pointer;
        }

        ul {
            list-style-type: none;
        }
    </style>
</head>

<body>

    <header>NIVER NA CHAPA</header>

    <main>
        <div class="container">
            <div class="itens_cont">
                <img src="img/bolo de chocolate.jpg">
                <details>
                    <summary>
                        <h2>Comemore seu aniversário conosco</h2>
                    </summary>
                    <ul>
                        <li>Espaço reservado</li>
                        <li>Hambúrguer grátis para o aniversariante</li>
                        <li>Bolo grátis se tiver mais de 5 amigos</li>
                        <li>Entre em contato pelo WhatsApp: <strong>(14) 99999-9899</strong></li>
                    </ul>
                </details>
            </div>

        </div>

    </main>

</body>
</html>
