<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Niver na Chapa</title>
    <style>
        footer {
    width: 100%;
    background-color: #f2f2f2;
    border-top: 1px solid #ccc;
    padding: 40px 60px;
    justify-content: space-around;
    box-sizing: border-box;
}

/* Container interno */
.footer-container {
    display: flex;
    justify-content: space-around;
    align-items: flex-start;
    flex-wrap: wrap;
    gap: 30px;
    width: 100%;
    box-sizing: border-box;
}

/* Logo */
.footer-logo {
    max-width: 220px;
    text-align: center;
    box-sizing: border-box;
}

.footer-logo img {
    width: 80px;
    margin-bottom: 10px;
    box-sizing: border-box;
}

.footer-logo h2 {
    font-size: 15px;
    margin-bottom: 5px;
    color: #222;
    box-sizing: border-box;
}

.footer-logo p {
    font-size: 14px;
    color: #666;
    width: 100%;
    box-sizing: border-box;
}

/* Colunas */
.footer-coluna {
    width: 10px;
    box-sizing: border-box;
}

/* Títulos */
.footer-coluna h3 {
    font-size: 16px;
    margin-bottom: 20px;
    color: #000;
    box-sizing: border-box;
}

/* Lista */
.footer-coluna ul {
    list-style: none;
    padding: 0;
}

.footer-coluna ul li {
    margin-bottom: 10px;
    box-sizing: border-box;
}

/* Links */
.footer-coluna a {
    text-decoration: none;
    color: hsl(0, 0%, 0%);
    transition: 0.3s;
}

.footer-coluna a:hover {
    color: hsl(0, 84%, 27%);
}

/* Redes */
.footer-social {
    font-size: 18px;

}
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f2e1e1;
            background-image: url(img/fundo.png);
        }

        header {
            background-color: #b30000;
            color: white;
            text-align: center;
            font-size: 80px;
            font-weight: bold;
            padding: 40px 0;
        }

        .container {
            display: flex;
            align-items: center;
            justify-content: space-around;
            gap: 50px;
            margin: 40px;
        }

        .itens_cont {
            width: 50%;
            background-color: #b30000;
            border-radius: 10px;
            text-align: center;
            padding: 20px;
        }

        .itens_cont img {
            width: 50%;
            border-radius: 10px;
        }

        .itens_cont h2 {
            color: rgb(252, 231, 204);
        }

        .itens_cont ul li {
            color: antiquewhite;
        }

        summary {
            list-style: none;
            cursor: pointer;
        }

        ul {
            list-style-type: none;
        }
    </style>
</head>

<body>

    <header>NIVER NA CHAPA</header>

    <main>
        <div class="container">
            <div class="itens_cont">
                <img src="img/bolo de chocolate.jpg">
                <details>
                    <summary>
                        <h2>Comemore seu aniversário conosco</h2>
                    </summary>
                    <ul>
                        <li>Espaço reservado</li>
                        <li>Hambúrguer grátis para o aniversariante</li>
                        <li>Bolo grátis se tiver mais de 5 amigos</li>
                        <li>Entre em contato pelo WhatsApp: <strong>(14) 99999-9899</strong></li>
                    </ul>
                </details>
            </div>

        </div>

    </main>

</body>
</html>
