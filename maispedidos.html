<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bebidas</title>
    <link rel="shortcut icon" href="img/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="Estilo.css">
    <style>
       body {
            margin: 0;
            padding: 0;
            background-image: url("img/fundotundo.png");
            
        }
        .banner {
            background: linear-gradient(rgba(180, 0, 0, 0.422), rgba(180, 0, 0, 0.614)),
                url('img/fundo\ do\ banner.png');
            background-size: cover;
            background-position: center;
            color: antiquewhite;
            text-align: center;
            padding: 60px 20px;
        }

        .banner h1 {
            font-size: 70px;
            letter-spacing: 5px;
        }

        .conteiner_bebidas {
          display: flex;
         flex-wrap: wrap;
         justify-content: center;
         gap: 20px;
         padding: 30px;
         width: 100%;
         box-sizing: border-box;

        }

        .itens_cont {
            width: 23%;
            background-color: #970101;
            border-radius: 10px;
            height: 325px;
            overflow: hidden;
        }
        .itens_cont:hover {
            height: 400px;
            transition: height 0.9s ease;
     
        }

        .itens_cont img {
            justify-content: space-around;
            width: 100%;
            padding: 5px;
            border-radius: 10px;
            box-sizing: border-box;
        }

        .itens_cont h2 {
            margin-top: 40px;
            text-align: center;
            color: antiquewhite;
        }
        .itens_cont p {
            text-align: center;
            margin-top: 20px;
            color: antiquewhite;
        }

        h2{
            cursor: pointer;
        }
        
    </style>
</head>

<body>
 <header>
        <div class="banner">
            <h1>BEBIDAS</h1>
        </div>
    </header>
    <main>
        <div class="conteiner_bebidas">
            <div class="itens_cont">
                <img src="img/agua.png">
                
                    <h2>PREÇO</h2>
                    <p>Água R$2,50</p>
                
            </div>

            <div class="itens_cont">
                <img src="img/refrigerantes.png">
                   
                     <h2>REFRIGERANTES</h2>
                    <p>Refrigerante R$3,99</p>
                
            </div>
         
            <div class="itens_cont">
                <img src="img/sucos.png">
               
                    <h2>SUCOS</h2>
                    <p>Suco R$7,00</p>
                
            </div>

            <div class="itens_cont">
                <img src="img/long.png">
                
                     <h2>LONG NECK</h2>
                    <p>R$7,50</p>
                
            </div>

        </div>
    </main>
    <!--Rodapé-->
    <footer>

        <div class="container">

            <!-- Logo -->
            <div class="logo">
                <img src="img/Logo.png" width="100px" height="60px" alt="Arte na Chapa">

                <h2>ARTE NA CHAPA</h2>

                <p>HAMBURGUERIA</p>
            </div>

            <!-- Institucional -->
            <div class="coluna">
                <h3>INSTITUCIONAL</h3>

                <ul>
                    <li><a href="index.html">INÍCIO</a></li>
                    <li><a href="quemsomos.html">QUEM SOMOS</a></li>
                    <li><a href="index.html">MENU</a></li>
                    <li><a href="maispedidos.html">BEBIDAS</a></li>
                    <li><a href="combos.html">COMBOS</a></li>
                </ul>
            </div>

            <!-- Contato -->
            <div class="coluna">
                <h3>ENTRE EM CONTATO</h3>

                <a href="https://web.whatsapp.com/">ENTRE EM CONTATO</a>
            </div>

            <!-- Redes -->
            <div class="coluna">
                <h3>REDES SOCIAIS</h3>
                <a href="https://www.instagram.com/artenachapa" target="_blank">
                    <p class="social">@artenachapa</p>
                    <img src="img/inst_logo_01.png" width="20px" height="20px" alt="Instagram">
                </a>
            </div>


        </div>

    </footer>
</body>


</html>
