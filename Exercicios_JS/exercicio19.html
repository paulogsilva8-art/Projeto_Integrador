<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>exercicio19</title>
</head>
<body>
     
    <input type="text" id="valor1">
    <br><br>

    <input type="text" id="valor2">
    <br><br>

    <input type="text" id="resultado" disabled>
    <br><br>

    <button onclick="calcular()">Calcular</button>

    <script>
        function calcular() {
            var valor1 = Number(document.getElementById("valor1").value);
            var valor2 = Number(document.getElementById("valor2").value);

            var resultado = valor1 * valor2;

            document.getElementById("resultado").value = resultado;
        }
    </script>
</body>
</html>
