<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio</title>
    <style>
        .bloco{
            padding: 10px;
            background-color: gray;
            width: 30%;
            margin: auto;
            text-align: center;
            border-radius: 5px;
        }
        .bloco input{
            margin: 10px auto;
            width: 95%;
            padding: 10px;
        }
        .bloco button{
            padding: 10px;
            width: 22%;
        }


    </style>
</head>
<body>
    <div class="bloco">
    <h2>Exercício JS</h2>
    <input type="text" id="entrada" placeholder="digite o valor de entrada">
    <br>
    <br>
    <button id="add" onclick="adicionarvalor()">Adicionar</button>
    <button>Ordenar</button>
    <button>Deletar</button>
    <button>Pesquisar</button>
    <br>
    <br>
    <input type="text" id="saida" disabled="disabled">
    </div>
    <script>
        var lista = []
        function adicionarvalor(){
         var ent = document.getElementById('entrada').value;
         lista.unshift(ent);
         document.getElementById('saida').value = lista;
        document.getElementById('entrada').value = null;    
        }
    </script>
</body>
</html>
