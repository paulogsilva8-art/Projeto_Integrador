        /* ===== RODAPÉ ===== */


footer {
    width: 100%;
    background-color: #f2f2f2;

/* Container interno */
.footer-container {

}

.footer-logo p {

}

/* Colunas */
.footer-coluna {
    min-width: 180px;
}

/* Títulos */
.footer-coluna h3 {

    margin-bottom: 20px;

}

/* Lista */
.footer-coluna ul {

}

.footer-coluna ul li {
    margin-bottom: 10px;
}

/* Links */
.footer-coluna a {
    text-decoration: none;
    color: hsl(0, 0%, 0%);
    transition: 0.3s;
}

.footer-coluna a:hover {
    color: hsl(0, 84%, 27%);
}

/* Redes */
.footer-social {

}
