<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedidos</title>
    <link rel="stylesheet" href="Style/footer2.css">
    <style>
        /*Aqui que "tudo"*/
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        /* Fundo geral */
        body {
            background-image: url(img/fundotundo.webp);
        }

        /* Banner */
        .banner {
            background-image: url('img/Fundo\ vermelho.png');
            ;
            background-size: cover;
            background-position: center;
            color: white;
            text-align: center;
            padding: 60px 20px;
            margin-bottom: 50px;
        }

        .banner h1 {
            font-size: 80px;
            letter-spacing: 5px;
        }

        form {
            width: 100%;
            padding: 30px 50px;
        }

        /* Container do formulário */
        .container {
            background: white;
            max-width: 900px;
            margin: auto;
            padding: 30px;
            border-radius: 12px;
        }

        /* Títulos */
        h2 {
            margin-bottom: 15px;
            color: #333;
        }

        /* Inputs e selects */
        input,
        select,
        textarea {
            width: 100%;
            padding: 10px;
            margin: 8px 0 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            transition: 0.3s;
        }

        /* Efeito ao clicar */
        input:focus,
        select:focus,
        textarea:focus {
            border-color: #d10000;
            outline: none;
        }

        /* Linha (nome + telefone lado a lado) */
        .linha {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }

        .linha div {
            flex: 1;
            min-width: 200px;
        }

        /* Adicionais */
        .adicionais {
            margin: 15px 0;
        }

        .area-final {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: flex-end;
        }

        .adicionais label {
            display: block;
            margin-bottom: 10px;
            cursor: pointer;
        }


        /* Botão */
        button {
            width: 100%;
            padding: 15px;
            background: rgba(155, 0, 4);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: rgba(155, 0, 4);
            transform: scale(1.02);
        }

        .rodapé {
            background-color: hsl(0, 0%, 100%);
        }
    </style>
</head>

<body>
    <div class="banner">
        <h1>FAÇA SEU PEDIDO</h1>
    </div>

    <div class="container">
        <form id="pedidoForm">

            <div class="linha">
                <div>
                    <label>Nome</label>
                    <input type="text" name="nome">
                </div>

                <div>
                    <label>Telefone</label>
                    <input type="text" name="telefone">
                </div>
            </div>

            <label>Escolha seu Hambúrguer</label>
            <select id="hamburguer">
                <option value="0">Nenhum</option>
                <option value="25">Brie Burger - R$25</option>
                <option value="22">Queijo Coalho - R$22</option>
                <option value="20">Carne com Queijo - R$20</option>
                <option value="24">Catupiry com Bacon - R$24</option>
                <option value="21">Chicken - R$21</option>
                <option value="23">Quatro Queijos - R$23</option>
            </select>

            <label>Escolha seu Combo</label>
<select id="combo">
    <option value="0">Nenhum</option>
    <option value="10">Combo 1 - R$10</option>
    <option value="15">Combo 2 - R$15</option>
    <option value="18">Combo 3 - R$18</option>
</select>

            <div class="adicionais">
                <h2>Adicionais</h2>
                <label><input type="checkbox" value="5"> Bacon extra (R$5)</label>
                <label><input type="checkbox" value="4"> Queijo extra (R$4)</label>
                <label><input type="checkbox" value="3"> Cebola caramelizada (R$3)</label>
            </div>

            <h2>Bebidas</h2>
            <select id="bebida">
                <option value="0">Nenhum</option>
                <option value="3">Água marca Crystal- R$3,00</option>
                <option value="6">Suco marca Del Valle - R$6,00</option>
                <option value="7">Refrigerante Coca Cola- R$7,00</option>
                <option value="6">Refrigerante Guaraná Antartica- R$6,00</option>
                <option value="10">Cerveja long neck Heineken- R$10,00</option>
                <option value="9">Cerveja long neck Budweiser- R$9,00</option>
            </select>

            <label>
                <h2>Endereço para entrega</h2>
            </label>
            <input type="text" name="endereco">

            <label>
                <h2>Observações</h2>
            </label>
            <textarea placeholder="Ex: tirar cebola..." name="observacoes"></textarea>

            <p class="total">Total: R$ <span id="total">0.00</span></p>

            <button type="submit">Enviar Pedido</button>

        </form>
    </div>

    <br>
    <br>
    <br>
    <br>
    <br>
    <br>
    <br>


    <!-- A partir daq começa o rodapé -->
    <footer>

        <div class="footer-container">

            <!-- Logo -->
            <div class="footer-logo">
                <img src="img/Logo- fundo removido.png" width="30%" height="30%" alt="Arte na Chapa">

                <h2>ARTE NA CHAPA</h2>

                <p>Hamburgueria</p>
            </div>

            <!-- Institucional -->
            <div class="footer-coluna">
                <h3>INSTITUCIONAL</h3>

                <ul>
                    <li><a href="index2.html">INÍCIO</a></li>
                    <li><a href="quemsomos2.html">QUEM SOMOS</a></li>
                    <li><a href="index2.html">MENU</a></li>
                    <li><a href="Bebidas2.html">BEBIDAS</a></li>
                    <li><a href="combos2.html">COMBOS</a></li>
                </ul>
            </div>

            <!-- Contato -->
            <div class="footer-coluna">
                <h3>ENTRE EM CONTATO</h3>
                

                <a href="https://wa.me/14998387107" target="_blank">ENTRE EM CONTATO</a>
            </div>

            <!-- Redes -->
            <div class="footer-coluna">
                <h3>REDES SOCIAIS</h3>

                <p class="footer-social">@artenachapa</p>
            </div>

        </div>

    </footer>
    <script>
        function calcularTotal() {
            let total = 0;

            total += Number(document.getElementById("hamburguer").value);
            total += Number(document.getElementById("combo").value);
            total += Number(document.getElementById("bebida").value);

            document.querySelectorAll('.adicionais input[type="checkbox"]:checked').forEach(item => {
                total += Number(item.value);
            });

            document.getElementById("total").textContent = total.toFixed(2);
        }

        document.getElementById("pedidoForm").addEventListener("change", calcularTotal);
    </script>
</body>

</html>
