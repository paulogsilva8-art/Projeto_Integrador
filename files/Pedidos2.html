<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedidos</title>
    <link rel="stylesheet" href="Style/footer2.css">
    <style>
        /*Aqui é meio que tudo*/
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        /* Fundo geral */
        body {
            background-image: url(img/fundotundo.png);
        }

        /* Banner */
        .banner {
            background-image: url('img/Fundo\ vermelho.png');
            ;
            background-size: cover;
            background-position: center;
            color: white;
            text-align: center;
            padding: 60px 20px;
            margin-bottom: 50px;
        }

        .banner h1 {
            font-size: 80px;
            letter-spacing: 5px;
        }

        form {
            width: 100%;
            padding: 30px 50px;
        }

        /* Container do formulário */
        .container {
            background: white;
            max-width: 900px;
            margin: auto;
            padding: 30px;
            border-radius: 12px;
        }

        /* Títulos */
        h2 {
            margin-bottom: 15px;
            color: #333;
        }

        /* Inputs e selects */
        input,
        select,
        textarea {
            width: 100%;
            padding: 10px;
            margin: 8px 0 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            transition: 0.3s;
        }

        /* Efeito ao clicar */
        input:focus,
        select:focus,
        textarea:focus {
            border-color: #d10000;
            outline: none;
        }

        /* Linha (nome + telefone lado a lado) */
        .linha {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }

        .linha div {
            flex: 1;
            min-width: 200px;
        }

        /* Adicionais */
        .adicionais {
            margin: 15px 0;
        }

        .area-final {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: flex-end;
        }

        .adicionais label {
            display: block;
            margin-bottom: 10px;
            cursor: pointer;
        }


        /* Botão */
        button {
            width: 100%;
            padding: 15px;
            background: rgba(155, 0, 4);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: rgba(155, 0, 4);
            transform: scale(1.02);
        }

        .rodapé {
            background-color: hsl(0, 0%, 100%);
        }
    </style>
</head>

<body>
    <div class="banner">
        <h1>FAÇA SEU PEDIDO</h1>
    </div>

    <div class="container">
        <form>

            <div class="linha">
                <div>
                    <label>Nome</label>
                    <input type="text">
                </div>

                <div>
                    <label>Telefone</label>
                    <input type="text">
                </div>
            </div>

            <label>Escolha seu Hambúrguer</label>
            <select>
                <option>Brie Burger</option>
                <option>Queijo Coalho</option>
                <option>Carne com Queijo</option>
                <option>Catupiry com Bacon</option>
                <option>Chicken</option>
                <option>Quatro Queijos</option>
            </select>

            <label>Escolha seu Combo</label>
            <select>
                <option>Combo 1</option>
                <option>Combo 2</option>
                <option>Combo 3</option>
            </select>

            <div class="adicionais">
                <h2>Adicionais</h2>
                <label><input type="checkbox"> Bacon extra</label>
                <label><input type="checkbox"> Queijo extra</label>
                <label><input type="checkbox"> Cebola caramelizada</label>
            </div>

            <label0>
                <h2>Bebidas</h2></label>
                <select>
                    <option>Água</option>
                    <option>Suco</option>
                    <option>Refrigerante</option>
                    <option>Cerveja</option>
                </select>

                <label>
                    <h2>Endereço para entrega</h2>
                </label>
                <input type="text">

                <label>
                    <h2>Observações</h2>
                </label>
                <textarea placeholder="Ex: tirar cebola..."></textarea>

                <button>Enviar Pedido</button>

        </form>
    </div>
    <br>
    <br>
    <br>
    <br>
    <br>
    <br>
    <br>


    <!-- A partir daq começa o rodapé -->
    <footer>

        <div class="footer-container">

            <!-- Logo -->
            <div class="footer-logo">
                <img src="img/Logo- fundo removido.png" width="30%" height="30%" alt="Arte na Chapa">

                <h2>ARTE NA CHAPA</h2>

                <p>Hamburgueria</p>
            </div>

            <!-- Institucional -->
            <div class="footer-coluna">
                <h3>INSTITUCIONAL</h3>

                <ul>
                    <li><a href="index2.html">INÍCIO</a></li>
                    <li><a href="quemsomos2.html">QUEM SOMOS</a></li>
                    <li><a href="index2.html">MENU</a></li>
                    <li><a href="Bebidas2.html">BEBIDAS</a></li>
                    <li><a href="combos2.html">COMBOS</a></li>
                </ul>
            </div>

            <!-- Contato -->
            <div class="footer-coluna">
                <h3>ENTRE EM CONTATO</h3>
                ,

                <a href="https://wa.me/14998387107" target="_blank">ENTRE EM CONTATO</a>
            </div>

            <!-- Redes -->
            <div class="footer-coluna">
                <h3>REDES SOCIAIS</h3>

                <p class="footer-social">@artenachapa</p>
            </div>

        </div>

    </footer>
</body>

</html>
