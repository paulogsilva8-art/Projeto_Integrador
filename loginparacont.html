<!DOCTYPE html>
<html lang="pt-br">
<head>
    <link rel="shortcut icon" href="img/favicon.ico" type="image/x-icon">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Arial, Helvetica, sans-serif;
}

body{
    background-image: url(img/fundotundo.webp);
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;

    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;
}

/* CARD */

.login-box{
    width:380px;
    background:white;
    padding:35px;
    border-radius:18px;
    box-shadow:0 10px 30px rgba(0,0,0,.3);
}

.login-box h2{
    text-align:center;
    color:#b30000;
    margin-bottom:25px;
}

.form-group{
    margin-bottom:20px;
}

.form-group label{
    display:block;
    margin-bottom:8px;
    font-weight:bold;
}

.form-group input{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:10px;
    font-size:15px;
    transition:.3s;
}

.form-group input:focus{
    outline:none;
    border-color:#b30000;
}

/* BOTÕES */

.botoes{
    display:flex;
    flex-direction:column;
    gap:12px;
    margin-top:20px;
}

.btn{
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    font-size:16px;
    cursor:pointer;
    transition:.3s;
    text-decoration:none;
    text-align:center;
}

.btn-login{
    background:#b30000;
    color:white;
}

.btn-login:hover{
    background:#8f0000;
}

.login_btn{
    display:none;
}

    </style>

</head>
<body>

<div class="login-box">

    <h2>Faça login para continuar</h2>

    <div class="form-group">
        <label>Email</label>
        <input type="email" placeholder="seu@email.com" id="email">
    </div>

    <div class="form-group">
        <label>Senha</label>
        <input type="password" placeholder="Sua senha" id="senha">
    </div>

    <div class="botoes">

        <button class="btn btn-login" onclick="logarSenha()">
            Login
            <a href="Pedidos2.html" class="btn btn-pedido login_btn" id="pedido"></a>
        </button>




    </div>

</div>

<script>

function logarSenha(){

    var emailLog = document.getElementById('email').value;
    var senhaLog = document.getElementById('senha').value;

    if(emailLog == "arte" && senhaLog == "nachapa"){

        alert("Login efetuado!");
        window.location.href = "./pedidos2.html"

        

    }else{

        alert("Email ou senha incorretos!");

    }

}

</script>

</body>
</html>
